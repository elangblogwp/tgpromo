[project]
name = "telegram-discussion-userbot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["Telethon==1.45.0", "aiohttp==3.14.5", "aiosqlite==0.22.1", "cryptography==47.0.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
